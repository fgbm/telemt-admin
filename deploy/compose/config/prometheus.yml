global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers: []

rule_files: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'telemt'
    static_configs:
      - targets: ['telemt:9091']
    metrics_path: '/metrics'
    # Если telemt требует авторизацию на /metrics (например, тот же auth_header,
    # что и для control API), раскомментируйте блок ниже и укажите токен:
    # authorization:
    #   type: Bearer
    #   credentials: "your-secret-token"
    #
    # Альтернатива: если telemt отдаёт метрики на отдельном порту без auth,
    # измените targets на 'telemt:<metrics-port>'.
