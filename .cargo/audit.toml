[advisories]
# RUSTSEC-2023-0071: Marvin Attack in `rsa` crate.
# This vulnerability is pulled in via `sqlx-mysql`, which is a transitive dependency
# of `sqlx` macros. We only use the `sqlite` feature of `sqlx` at runtime,
# so the `rsa` code path is never exercised.
#
# RUSTSEC-2026-0173: `proc-macro-error2` is unmaintained.
# It is a transitive dependency of `teloxide` -> `aquamarine` (build-time proc-macro)
# and there is no newer `aquamarine` release yet, so the warning cannot be fixed
# by upgrading. The crate runs only at compile time.
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0173"]
